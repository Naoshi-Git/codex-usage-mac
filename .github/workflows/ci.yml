name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: macOS / Node ${{ matrix.node }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Offline self-test
        run: node ./bin/codex-usage.mjs --self-test

      - name: Help smoke test
        run: node ./bin/codex-usage.mjs --help >/dev/null
